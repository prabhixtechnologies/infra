# Production overrides — pre-built images, hardened defaults, secrets from deploy/.env.prod.
#
# Every service carries a memory limit, because the whole platform shares one t3.medium (4 GiB)
# with MobiStack. Docker applies no limit by default, so without these the first service to leak
# takes the others down through the kernel OOM killer — and the kernel picks its victim by resident
# size, which means the busiest healthy process dies rather than the one at fault.
#
# Steady state, once the database has moved to RDS and MobiStack shares this box:
#
#   platform backend   1024m      identity            384m      marketing   384m
#   mobistack backend   640m      pgbouncer            64m      caddy       128m
#   web / admin / mailroom / mobistack web              48m each
#
# ~2.8 GiB of ceilings against ~3.7 GiB usable. These are ceilings, not reservations, so real usage
# sits well below them; the remainder is page cache and the mail server when its profile is up.
#
services:
  # Both datastores now run as managed services, so both containers are parked behind `never` — a
  # profile nothing activates — rather than deleted from the base file, because local development
  # still wants them. Same trick mailpit uses at the bottom of this file.
  #
  # Reclaiming postgres's 512m is what makes the arithmetic above work: MobiStack's JVM could not
  # have landed on this box while a database was also resident on it.
  postgres:
    profiles:
      - never

  redis:
    profiles:
      - never

  # Points at whatever POSTGRES_HOST says: the local container before the RDS cutover, the RDS
  # endpoint after it. The pooler stays either way — RDS gives a connection ceiling, not a pooler,
  # and instances this size have a low max_connections.
  pgbouncer:
    restart: always
    # !reset, because the base file waits for the postgres container to report healthy and that
    # container no longer starts here. Left as-is, the pooler would wait forever on a service that
    # compose has been told never to run, and the whole deploy would hang before the backend.
    depends_on: !reset null
    environment:
      DB_HOST: ${POSTGRES_HOST:-postgres}
      # RDS ships rds.force_ssl=1 in its default parameter group, so an unencrypted connection is
      # refused outright — and the error it returns is "no pg_hba.conf entry for host ...", which
      # reads like a firewall or an allowlist problem rather than a missing TLS negotiation.
      # `prefer` is the default only so the local container, which offers no TLS, still works.
      # Production sets `require`; move to verify-full once the RDS CA bundle is mounted here.
      SERVER_TLS_SSLMODE: ${PGBOUNCER_SERVER_TLS_SSLMODE:-prefer}
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    # REGISTRY is the ECR host. It used to default to a Docker Hub namespace so a box that had not
    # migrated kept working; that default is gone along with Docker Hub, and the comment describing
    # it was left behind as the only remaining trace.
    #
    # A tag per service, each falling back to TAG.
    #
    # Four of these used to share TAG because they were built from one repository, so one sha
    # described all four. They are not any more — backend and the two consoles come from oneOps,
    # marketing from Platform — and a single TAG would name a commit that exists in one of those
    # histories and not the other. Whichever it came from, the other two images would be pulled at a
    # tag nothing had ever pushed.
    #
    # The old comment here warned that a second release pointer per service is how a requested tag or
    # a rollback gets silently ignored, and it was right: that is exactly how an IDENTITY_TAG in the
    # env file beat the one on the command line. The answer is not one pointer, it is that deploy.sh
    # treats every one of these identically — remembering what the caller asked for across the env
    # file, and rolling back each service to the tag its own container was running.
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/backend:${BACKEND_TAG:-${TAG:-latest}}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024m
    # !override, not a merge: depends_on is a mapping, so adding it here would union with the base
    # file's entries and keep waiting on a redis container that production does not run.
    depends_on: !override
      pgbouncer:
        condition: service_healthy
    # deploy.sh sources deploy/.env.prod and passes --env-file for interpolation.
    environment:
      # Replaces the Dockerfile's default. 75% of a limit this size leaves too little for metaspace,
      # code cache and direct buffers, and the JVM does not count those against MaxRAMPercentage —
      # the container gets OOM-killed with exit 137 and no Java stack trace to explain it.
      #
      # ExitOnOutOfMemoryError because the alternative is worse: by default a heap OOM kills one
      # thread and leaves the process up, so it keeps passing its health check while failing
      # requests. Exiting hands it to `restart: always`.
      #
      # UseCompactObjectHeaders shrinks every object header from 12 bytes to 8. A product option in
      # JDK 25 rather than the experimental flag it was in 24, so it needs no unlock flag, but still
      # off by default. Worth turning on here specifically because this box is four JVMs in 4 GiB and
      # this application's heap is mostly small objects — entities, DTOs, strings — where the header
      # is a large fraction of each one. Delete the line to back it out; nothing depends on it.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60
        -XX:+UseContainerSupport
        -XX:+UseCompactObjectHeaders
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
      # `valkey` alongside `prod` is what switches Redis config from host/port to the cluster
      # endpoint with TLS. Kept as a separate profile so a prod-profile run against a plain Redis
      # container is still possible.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,valkey}
      SERVER_PORT: ${SERVER_PORT:-8080}
      VIRTUAL_THREADS: "true"
      SWAGGER_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Through the pooler, and it stays that way on RDS: what changes is where pgbouncer points.
      # prepareThreshold=0 is not optional — transaction pooling hands a different server connection
      # to each transaction, so a server-side prepared statement is not there the second time.
      DB_URL: ${DB_URL:-jdbc:postgresql://pgbouncer:5432/${POSTGRES_DB:-oneops}?prepareThreshold=0}
      DB_USERNAME: ${DB_USERNAME:-oneops}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env.prod}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      # The ElastiCache Valkey serverless endpoint, e.g.
      # prabhixtechnologies-abc123.serverless.aps1.cache.amazonaws.com:6379. One entry, not a node
      # list: the driver discovers the topology behind it. Required, because a blank value would
      # leave the valkey profile resolving nothing and fail startup with a placeholder error that
      # says less than this does.
      #
      # REDIS_HOST and REDIS_PORT are still inherited from the base file and are dead weight here:
      # the valkey profile configures a cluster, and Spring prefers a cluster over standalone. They
      # are left in place because local development reads them from that same base file.
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:?set REDIS_CLUSTER_NODES in deploy/.env.prod}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env.prod}
      JWT_ISSUER: ${JWT_ISSUER:-prabhix-platform}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P30D}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      MARKETING_URL: ${MARKETING_URL:?set MARKETING_URL}
      CONSOLE_URL: ${CONSOLE_URL:?set CONSOLE_URL}
      API_URL: ${API_URL:?set API_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      # Parent domain of every console hostname, so one sign-in covers admin. and oneops. A cookie
      # domain the response is not served from is dropped by the browser without comment, which
      # looks exactly like a broken login, so this is required rather than defaulted.
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:?set SESSION_COOKIE_DOMAIN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # The storefront, chat widget and visitor beacon are public endpoints guarded by Origin
      # rather than a token, and each reads its own allowlist. Left unset they default to
      # http://localhost:3000, so production rejects the real site with 403 — and only in a
      # browser, because a curl without an Origin header passes. Required, not defaulted.
      VISITOR_ALLOWED_ORIGINS: ${VISITOR_ALLOWED_ORIGINS:?set VISITOR_ALLOWED_ORIGINS}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:?set CHAT_ALLOWED_ORIGINS}
      COMMERCE_ALLOWED_ORIGINS: ${COMMERCE_ALLOWED_ORIGINS:?set COMMERCE_ALLOWED_ORIGINS}
      MAIL_FROM: ${MAIL_FROM:-no-reply@prabhixtechnologies.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Prabhix Technologies}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@prabhixtechnologies.com}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-SMTP_RELAY}
      MAIL_OUTBOX_ENABLED: ${MAIL_OUTBOX_ENABLED:-true}
      MAIL_IMAP_ENABLED: ${MAIL_IMAP_ENABLED:-false}
      MAIL_LMTP_TOKEN: ${MAIL_LMTP_TOKEN:-}
      MAIL_TRACKING_ENABLED: ${MAIL_TRACKING_ENABLED:-false}
      MAIL_TRACKING_SECRET: ${MAIL_TRACKING_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-postfix}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      INVOICE_PREFIX: ${INVOICE_PREFIX:-PBX}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Ops hub — DefaultCredentialsProvider (instance role) + optional GitHub PAT
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      AWS_CE_REGION: ${AWS_CE_REGION:-us-east-1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  identity:
    restart: always
    deploy:
      resources:
        limits:
          memory: 384m
    # The pooler, not the database: identity used to wait on the postgres container, which no
    # longer runs here. It reaches its own database through pgbouncer like everything else.
    depends_on: !override
      pgbouncer:
        condition: service_healthy
    environment:
      # SerialGC here and nowhere else. Identity is the smallest heap on the box and its work is
      # short request/response with almost no garbage; G1's region bookkeeping and its concurrent
      # threads cost more than they return at this size. The platform backend keeps G1, because it
      # holds SSE connections where a stop-the-world pause is visible to users.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60
        -XX:+UseContainerSupport
        -XX:+UseSerialGC
        -XX:+UseCompactObjectHeaders
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,valkey}
      # Defaulted rather than required, unlike the backend's copy of this variable: identity sits
      # behind a compose profile, and compose interpolates every service in the file whether its
      # profile is active or not. A `${...:?}` here would fail `up` for the whole stack on a box
      # that is not running identity — the same reasoning as IDENTITY_SIGNING_KEY below.
      #
      # Must be the same cache as the backend: the deny list is one keyspace that identity writes
      # and every product reads.
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-}
      # Defaulted rather than `${...:?}`, even though a blank key cannot work here.
      #
      # Compose interpolates every service in the file, including ones behind an inactive profile, so
      # a required variable would fail `config` and `up` for the entire stack on a box that has no
      # reason to run identity yet — the whole platform, unable to deploy, because of a service
      # nobody asked for. SigningKeyProvider refuses to start on a blank key outside a local profile,
      # so the check happens where it belongs: in the container that needs it.
      IDENTITY_SIGNING_KEY: ${IDENTITY_SIGNING_KEY:-}
      SWAGGER_ENABLED: "false"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  web:
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/web:${WEB_TAG:-${TAG:-latest}}
    build: !reset null
    restart: always
    # nginx serving a built bundle from disk. The page cache does the work and lives outside the
    # cgroup, so the limit only has to cover the worker processes.
    deploy:
      resources:
        limits:
          memory: 48m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Built from the same source tree as `web` but with APP=admin, so it is a separate image rather
  # than the same one served on a second hostname.
  admin:
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/admin:${ADMIN_TAG:-${TAG:-latest}}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 48m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Built from the sibling Mailroom repository by its own CI, so there is nothing to build here even
  # in development — the image is the interface between the two repos. That also means its tags are
  # that repository's commits, which is why it carries its own MAILROOM_TAG and its own profile.
  mailroom:
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/mailroom:${MAILROOM_TAG:-${TAG:-latest}}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 48m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  marketing:
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/marketing:${MARKETING_TAG:-${TAG:-latest}}
    build: !reset null
    restart: always
    # A Node process rendering server components, so unlike the three nginx containers this one has
    # a real heap. Node sizes its old space from total host memory, not from the cgroup, so without
    # --max-old-space-size it would plan for a 4 GiB machine and get OOM-killed at 384m instead of
    # collecting garbage. Set to roughly two thirds of the limit.
    deploy:
      resources:
        limits:
          memory: 384m
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      # NEXT_PUBLIC_* values are inlined when the image is built, so setting them here only helps
      # if the image was built with the same values. They are declared for parity with the build
      # args in .github/workflows/ci.yml, which is the place that actually bakes them in.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
      # Without this the header "Sign in" link falls back to the compiled-in default.
      NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL:?set NEXT_PUBLIC_CONSOLE_URL}
      NEXT_PUBLIC_MOBISTACK_URL: ${NEXT_PUBLIC_MOBISTACK_URL:-https://mobistack.prabhixtechnologies.com}
      #
      # NEXT_PUBLIC_ORG_SLUG and NEXT_PUBLIC_ORG_ID used to be declared here too, as required
      # variables, and that did active harm. They have no runtime effect whatsoever -- Next replaces
      # them textually at build time, in the server bundle as well as the browser one -- so all the
      # declaration achieved was to oblige .env.prod to hold a value, make `docker exec marketing
      # env` report it, and thereby present a stale slug as if it were what the site uses. It said
      # prabhix-technologies long after the image had been rebuilt for prabhix-platform, which is
      # exactly the wrong thing to find when diagnosing a chat widget that does not work.
      #
      # The values live in .github/workflows/ci.yml and deploy/aws/build-push.ps1, which are the only
      # two places that bake them in.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app-store:
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/app-store:${APP_STORE_TAG:-${TAG:-latest}}
    build: !reset null
    restart: always
    environment:
      # Production always streams APKs from the private company bucket. The EC2 instance role
      # prabhix-ec2-ecr-pull carries s3:GetObject for this bucket (PrabhixApkDownloadsRead).
      APK_S3_BUCKET: ${APK_S3_BUCKET:-prabhix-apk-downloads}
      APK_S3_REGION: ${APK_S3_REGION:-ap-south-1}
    volumes: !reset null
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mailpit:
    profiles:
      - never
    # Mailpit is dev-only; prod uses real SMTP or the mailserver profile.
