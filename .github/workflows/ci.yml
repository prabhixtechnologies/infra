name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compose, PyYAML and Spring all accept a mapping with the same key twice and silently keep
      # the last one, so a second `environment:` block deletes the first with no error anywhere.
      - name: No duplicate keys
        run: |
          pip install --quiet pyyaml
          python deploy/check-yaml.py \
            docker-compose.yml docker-compose.local.yml docker-compose.prod.yml \
            .github/workflows/ci.yml .github/workflows/deploy.yml

      # deploy.sh knows every service by name — which variable pins its tag, which container to read
      # the previous tag from. A service added to compose and not to that list deploys at `latest`
      # and is left out of the rollback, with nothing in the output to say so.
      - name: deploy.sh names every application service
        run: |
          set -a && . deploy/.env.prod.example && set +a
          for key in $(grep -oP '^[A-Z][A-Z0-9_]*(?==)' deploy/.env.prod.example | sort -u); do
            [ -n "${!key:-}" ] || export "$key=ci-placeholder"
          done
          listed=$(grep -oP '^SERVICES="\K[^"]+' deploy/deploy.sh)
          for service in $(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --profile identity --profile mailroom --profile mobistack config --services); do
            case "$service" in postgres|redis|pgbouncer|caddy|mailpit|prometheus|grafana) continue ;; esac
            case " $listed " in
              *" $service "*) ;;
              *) echo "::error file=deploy/deploy.sh::$service is in compose but not in SERVICES"; exit 1 ;;
            esac
          done
          echo "deploy.sh knows: $listed"

      # The invariant is that every variable the production stack requires is named in the example
      # file — not that the example holds real values, which it deliberately does not. Mandatory
      # entries ship blank for the operator to fill, and a plausible-looking placeholder in there is
      # a thing somebody eventually deploys.
      #
      # So the blanks are filled with a marker here and `config` is asked to interpolate. A ${VAR:?}
      # the example never mentions is then the only thing that can fail, which is the mistake worth
      # catching: it otherwise surfaces on the server, at the first deploy after the change, as a
      # variable nobody knew to set.
      - name: Every variable the stack requires is named in the example
        run: |
          set -a && . deploy/.env.prod.example && set +a
          for key in $(grep -oP '^[A-Z][A-Z0-9_]*(?==)' deploy/.env.prod.example | sort -u); do
            [ -n "${!key:-}" ] || export "$key=ci-placeholder"
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null

      # identity, mailroom and mobistack sit behind profiles, so all three are enabled here — a
      # service that has quietly dropped out of the stack is otherwise indistinguishable from one
      # that is merely switched off.
      #
      # The build contexts point at sibling repositories that are not checked out here. Production
      # never uses them either, so their absence must not fail this, and `config` parses the file
      # without resolving them.
      - name: Every service is still in the stack
        run: |
          set -a && . deploy/.env.prod.example && set +a
          for key in $(grep -oP '^[A-Z][A-Z0-9_]*(?==)' deploy/.env.prod.example | sort -u); do
            [ -n "${!key:-}" ] || export "$key=ci-placeholder"
          done
          services=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile identity --profile mailroom --profile mobistack config --services | sort | tr '\n' ' ')
          echo "services: $services"
          for expected in backend web admin marketing identity mailroom mobistack-backend mobistack-web caddy pgbouncer; do
            case " $services " in
              *" $expected "*) ;;
              *) echo "::error::$expected is missing from the stack"; exit 1 ;;
            esac
          done

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deploy.sh rolls production back when it fails, so a syntax error in it is found at the worst
      # possible moment — half way through a deploy, by a script that can no longer roll anything
      # back.
      - name: Parse
        run: |
          for script in deploy/*.sh deploy/aws/*.sh; do
            bash -n "$script" || { echo "::error file=$script::does not parse"; exit 1; }
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/*.sh deploy/aws/*.sh

      # The IAM documents are only ever read by the AWS CLI, which reports a malformed one as a
      # parameter validation error that does not name the file.
      - name: IAM policies are JSON
        run: |
          for policy in deploy/aws/*.json; do
            python3 -m json.tool "$policy" >/dev/null || { echo "::error file=$policy::not valid JSON"; exit 1; }
          done

  runbooks:
    name: Runbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A runbook is followed once, by hand, under time pressure. A step naming a file that moved
      # six commits ago fails at the worst moment, and nothing else in this repository reads them.
      - name: Referenced files exist and the identifiers agree
        run: python deploy/check-runbooks.py
