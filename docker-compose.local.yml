# Local development overrides — publish ports and wire dev-friendly env vars.
# No bind mounts that break on Windows (Docker named volumes only in base).

services:
  postgres:
    ports:
      - "5432:5432"

  pgbouncer:
    ports:
      - "6432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      VIRTUAL_THREADS: "false"
      MAIL_TRANSPORT: SMTP_RELAY
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      MARKETING_URL: http://localhost:3000
      CONSOLE_URL: http://localhost:5173
      API_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
      SWAGGER_ENABLED: "true"
      LOG_LEVEL: DEBUG

  web:
    ports:
      - "5173:80"

  marketing:
    ports:
      - "3000:3000"

  mailpit:
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

  caddy:
    profiles:
      - caddy
    # Caddy is optional locally — hit services on their published ports instead.

  prometheus:
    profiles:
      - monitoring
    ports:
      - "9090:9090"

  grafana:
    profiles:
      - monitoring
    ports:
      - "3001:3000"
