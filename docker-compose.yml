# Prabhix platform — base Compose stack.
# Local:  docker compose -f docker-compose.yml -f docker-compose.local.yml up
# Prod:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Mail:   add -f ../Mailroom/mail-server/docker-compose.mail.yml --profile mailserver
#
# Build contexts point at sibling repositories, so this file only works from a checkout that sits
# beside them:
#
#   PrabhixTechnologies/
#     Infra/        this repository — compose, Caddy, deploy scripts, the databases' init SQL
#     oneOps/       backend, the two consoles, mobile
#     Platform/     the marketing site
#     Mailroom/     mail front ends and the mail transport
#     Identity/     sign-in, image-only here
#     MobiStack/    co-located, its own compose
#
# Production never uses those contexts — every service there resolves an `image:` from ECR and a
# missing sibling costs nothing, which is why the box checks out this repository alone. They exist so
# that one `docker compose build` from here still produces the whole product on a laptop.

name: prabhix

networks:
  prabhix:
    name: prabhix

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oneops}
      POSTGRES_USER: ${POSTGRES_USER:-oneops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oneops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oneops} -d ${POSTGRES_DB:-oneops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - prabhix

  # Transaction-mode pooler: multiplexes many Hikari client connections onto a small set of
  # Postgres server connections. Requires prepareThreshold=0 on the JDBC URL (see backend DB_URL).
  # Flyway must bypass PgBouncer — set FLYWAY_URL to postgres:5432 once application.yml supports it.
  #
  # PgBouncer is not a Docker Official Image, so AWS does not mirror it and there is nothing to
  # point at in the public gallery. It runs in production, so it is mirrored into our own private
  # registry by deploy/aws/mirror-third-party.ps1 instead of pulled from Docker Hub at deploy time.
  pgbouncer:
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/third-party/pgbouncer:1.22.1-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-oneops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oneops}
      # A wildcard, not a database name, and the difference matters. The entrypoint writes exactly
      # one `[databases]` entry from this value, so a literal name proxies that database and refuses
      # every other by name — which is how identity failed: its URL pointed at pgbouncer/identity,
      # the map held only oneops, and the connection was rejected as an unknown database rather than
      # as a misconfiguration. `*` makes pgbouncer forward whatever database the client asked for to
      # the same server, so oneops and identity share one pooler instead of needing one each.
      #
      # This widens what the pooler will connect to, not who may connect: Postgres still
      # authenticates and authorises every session, and a role with no rights on a database gets
      # nothing by asking pgbouncer for it.
      DB_NAME: "*"
      POOL_MODE: transaction
      # max_client_conn: backend replicas × DB_POOL_MAX (e.g. 4 × 20 = 80) is tiny vs operator SSE
      # scale; 10k client slots leave headroom for burst reconnects without opening 10k PG backends.
      MAX_CLIENT_CONN: 10000
      # These four are sized against the server's real ceiling, which is smaller than it looks:
      # `show max_connections` on the RDS instance reports 79, derived from the instance memory, not
      # a round number somebody chose. The whole box shares it.
      #
      # The previous values — pool 50, reserve 10, 80 per database — were written for a single
      # database and already reached the ceiling on their own. They are per database and per user,
      # so the wildcard above turns them into twice that, and the failure mode is not a slow pool:
      # it is `FATAL: too many connections`, on whichever service happens to reconnect next.
      #
      # Budget: ~10 for rdsadmin and monitoring, ~15 for MobiStack's Hikari pool, which talks to RDS
      # directly and not through here, leaving ~54. Two pools of 20 plus a reserve of 5 is 50.
      #
      # 20 is not a downgrade in capacity. Transaction pooling means a server connection is held for
      # the length of a transaction, not a session, so 20 of them serve the backend's 20 Hikari
      # clients and the thousands of idle SSE connections behind them without queueing.
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 25
      SERVER_RESET_QUERY: "DISCARD ALL"
      AUTH_TYPE: plain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-oneops} -d ${POSTGRES_DB:-oneops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prabhix

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prabhix

  backend:
    build:
      context: ../oneOps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:5432/${POSTGRES_DB:-oneops}?prepareThreshold=0
      DB_USERNAME: ${POSTGRES_USER:-oneops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oneops}
      # Migrations go straight to Postgres, bypassing PgBouncer. Transaction pooling cannot hold a
      # session-level advisory lock across statements, so Flyway's migration lock would not actually
      # protect concurrent deploys from racing each other.
      #
      # Overridable whole rather than only by host, because RDS also needs ?sslmode=require appended
      # and a URL is easier to replace than to assemble from parts.
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-oneops}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      # Trust for identity-issued RS256 tokens, alongside this service's own HS256 ones. Blank until
      # identity is running, and it must be set *before* AUTH_UPSTREAM is flipped — otherwise the
      # first token identity issues is one the backend cannot verify. See docs/IDENTITY.md.
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-}
      # Fetched over the internal network, not from the issuer URL. The issuer is an identifier that
      # has to match the token's iss claim exactly; where the keys are served from is a separate
      # question. Going out through Caddy would resolve to whatever AUTH_UPSTREAM currently points
      # at — the backend itself before cutover — so it would 404 precisely when it is needed.
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity:8081/.well-known/jwks.json}
      # Fills in the local users row for anyone who signed up through identity after the bulk import.
      # The same shared secret the identity service checks; blank leaves the mirror import-only.
      IDENTITY_INTERNAL_URL: ${IDENTITY_INTERNAL_URL:-http://identity:8081}
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-}
      # Ops hub (Cost Explorer / EC2 / optional GitHub checks) — instance role + optional PAT.
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      AWS_CE_REGION: ${AWS_CE_REGION:-us-east-1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    # The extra alias is what lets MobiStack share this network.
    #
    # MobiStack also has a service called `backend`. Docker's embedded DNS registers the service
    # name as a network alias and offers no way to opt out, so with both products on one network the
    # name `backend` returns two addresses and Caddy round-robins between two unrelated
    # applications — roughly half of this platform's API traffic answered by MobiStack's backend.
    #
    # `prabhix-backend` cannot collide, so the Caddyfile targets that instead. The plain `backend`
    # alias is still registered by Docker and still works for anything on this network that is not
    # sharing it with another product; it is simply no longer what the proxy relies on.
    networks:
      prabhix:
        aliases:
          - prabhix-backend

  # Prabhix Identity — signs the tokens every product verifies.
  #
  # Behind a profile, because it lives in a sibling repository and is built there: `docker compose
  # build` in this tree has no context for it, and an image reference that cannot be pulled would
  # fail `up` for everybody. Bring it in with `--profile identity` once the image exists.
  #
  # Its own database on the shared Postgres instance, created by
  # docker/postgres/init/02-identity-database.sql. A separate database rather than a schema, so "the
  # platform cannot read the users table" is enforced by the credentials rather than by convention.
  #
  # That script only runs on an empty data directory, so on a host whose volume already exists —
  # production — the database has to be created by hand first. See docs/IDENTITY.md.
  identity:
    profiles:
      - identity
    # Its own tag, for the same reason Mailroom has one: this image is built by the sibling Identity
    # repository and tagged with that repository's commits, so following TAG asks ECR for a Platform
    # commit sha that was never pushed there. The error is "manifest unknown", which reads like a
    # missing image rather than a tag from the wrong history.
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/identity:${IDENTITY_TAG:-${TAG:-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      # Must match what products verify against, exactly — the check is string equality, so a
      # trailing slash or http-for-https invalidates every token. api.prabhixtechnologies.com rather
      # than id., because that is where the Caddyfile serves discovery until id. has an A record.
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-https://api.prabhixtechnologies.com}
      # PKCS#8 PEM. Blank is refused outside a local profile: an ephemeral key would sign every user
      # out on restart, and with two replicas neither would accept the other's tokens.
      IDENTITY_SIGNING_KEY: ${IDENTITY_SIGNING_KEY:-}
      IDENTITY_RETIRED_PUBLIC_KEYS: ${IDENTITY_RETIRED_PUBLIC_KEYS:-}
      IDENTITY_DB_URL: ${IDENTITY_DB_URL:-jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${IDENTITY_DB_NAME:-identity}}
      # Its own role, not the platform's. A separate database only keeps the platform out of the
      # users table if the platform's credentials cannot reach it, and until now both services
      # connected as the same owner — so the separation was a convention after all. The role is
      # created by docker/postgres/init/02-identity-database.sql locally, and by hand on RDS.
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      # The same Redis as the platform, on purpose: the deny list is one set of keys that identity
      # writes and every product reads.
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Auth mail goes out from here rather than through the platform, so that identity does not
      # depend on a product that sits on top of it.
      #
      # AUTO means SES wherever SES_REGION is set and SMTP where it is not, so this file needs no
      # per-environment override: locally the SMTP settings below carry it to mailpit, and on the
      # production box the same variable the platform backend already uses selects SES.
      IDENTITY_MAIL_TRANSPORT: ${IDENTITY_MAIL_TRANSPORT:-AUTO}
      SES_REGION: ${SES_REGION:-}
      # Blank means the instance role, which is how production sends. A static key is only for
      # running outside AWS.
      SES_ACCESS_KEY: ${SES_ACCESS_KEY:-}
      SES_SECRET_KEY: ${SES_SECRET_KEY:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      # security@, not the platform's no-reply@: a password-reset mail that cannot be replied to is
      # one thing, but this address is also where somebody reports a sign-in they did not make.
      IDENTITY_MAIL_FROM: ${IDENTITY_MAIL_FROM:-security@prabhixtechnologies.com}
      CONSOLE_URL: ${CONSOLE_URL:-http://localhost:5173}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5174}
      MAILROOM_URL: ${MAILROOM_URL:-http://localhost:5175}
      MOBISTACK_URL: ${MOBISTACK_URL:-http://localhost:5173}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Phone sign-in. Blank account SID disables it, and the endpoints then refuse rather than
      # accepting a request and never delivering. For Indian numbers set the messaging service SID
      # rather than a bare from-number: DLT sender-id and template registration hang off the
      # messaging service, and without them the carrier drops the message while Twilio still
      # returns success — a failure invisible from this side.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      # CONSOLE_URL, ADMIN_URL, MAILROOM_URL and MOBISTACK_URL above also seed the OAuth clients'
      # redirect URIs, as {base}/auth/callback. Derived rather than configured separately so the
      # two cannot drift: a redirect URI that does not match the app it belongs to fails at
      # /authorize, not at deploy.
      # Shared secret the platform presents to /internal/users/lookup, and that this service presents
      # to the platform's /internal/organizations going the other way. Blank disables both, which for
      # signup means the hosted page says so rather than creating an account it must then withdraw.
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-}
      # Where the organization half of a signup is created. prabhix-backend rather than backend: see
      # the alias comment on the backend service — with MobiStack on this network, `backend` resolves
      # to two unrelated applications.
      PLATFORM_INTERNAL_URL: ${PLATFORM_INTERNAL_URL:-http://prabhix-backend:8080}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Off by default, because an error message can name a claim or an internal path and this service
      # answers unauthenticated requests. Worth being switchable: the OAuth endpoints reject with a
      # bare 400 whose reason is in the message and nowhere else — not the logs — so without this a
      # rejected /connect/logout or /oauth2/token is indistinguishable from any other bad request.
      SERVER_ERROR_INCLUDE_MESSAGE: ${SERVER_ERROR_INCLUDE_MESSAGE:-never}
      # Spring Security decides every sign-in and every OAuth rejection here, and reports its reasons
      # at DEBUG. At INFO a refused /connect/logout or /oauth2/token produces a bare 400 and no log
      # line at all, so there is nothing to work from — which is a bad place to be for the one service
      # every product's sign-in depends on. INFO by default: DEBUG names claims and token contents.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
    networks:
      - prabhix

  # The OneOps product console, sold to customers. Same source tree as `admin` below; the APP build
  # arg decides which of the two entry points is bundled.
  web:
    build:
      context: ../oneOps/web
      dockerfile: Dockerfile
      # Vite also inlines at build time. Unlike marketing, the console is a static SPA served by
      # nginx with no proxy, so the browser calls this URL directly — it must be host-reachable.
      args:
        APP: oneops
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_GOOGLE_SSO_ENABLED: ${VITE_GOOGLE_SSO_ENABLED:-false}
        # Set only after identity is the auth upstream. Set, this app redirects to the hosted login
        # page instead of rendering a password form, so setting it early makes sign-in impossible.
        VITE_IDENTITY_ISSUER: ${VITE_IDENTITY_ISSUER:-}
        # Adds the "My mail" link. This console's inbox is the shared team queue; personal mail is a
        # different product on a different host.
        VITE_MAILROOM_URL: ${MAILROOM_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    # BusyBox wget: nginx:alpine has no curl.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Same reasoning as the backend's alias above: MobiStack also has a service called `web`.
    networks:
      prabhix:
        aliases:
          - prabhix-web

  # Prabhix's own console: the platform-wide Ops Hub and cross-tenant logs, and nothing that acts on
  # a single organization. Served on its own hostname so the customer product never carries the
  # cross-tenant code, and so this one never carries the product.
  admin:
    build:
      context: ../oneOps/web
      dockerfile: Dockerfile
      args:
        APP: admin
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        # No Razorpay key: the admin app has no billing pages to check out from.
        VITE_GOOGLE_SSO_ENABLED: ${VITE_GOOGLE_SSO_ENABLED:-false}
        # Where "Open in OneOps" sends staff. Support means looking at the customer's own screens,
        # which live in the other app — this console has no tenant pages of its own.
        VITE_ONEOPS_URL: ${VITE_ONEOPS_URL:-http://localhost:5173}
        # Same issuer as the OneOps build on purpose: one hosted login page for both, which is what
        # makes signing in to one carry over to the other.
        VITE_IDENTITY_ISSUER: ${VITE_IDENTITY_ISSUER:-}
        VITE_MAILROOM_URL: ${MAILROOM_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prabhix

  # Prabhix Mailroom: a mail client for a person's own address, on its own hostname. Built from the
  # sibling Mailroom repository rather than from this one — it is a separate product with its own
  # release cadence, and the only thing it shares with the consoles is the identity provider.
  #
  # Deliberately not a third build target of ./web. The consoles are two views of one operations
  # product; this is a different application whose entire screen is one mailbox, and folding it in
  # would put mail-rendering code in the bundle of two apps that do not render mail.
  mailroom:
    # Behind a profile because the image is published by the Mailroom repository, not this one, and
    # is therefore tagged on that repository's commits rather than on this one's. Left always-on, a
    # deploy here would try to pull prabhix-mailroom at this repo's commit sha, find nothing, and
    # fail the whole `compose pull` — taking down a deploy of four services that were all fine.
    #
    # Enable with COMPOSE_PROFILES=mailroom once the image exists and is tagged independently.
    profiles:
      - mailroom
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/mailroom:${MAILROOM_TAG:-${TAG:-latest}}
    build:
      context: ../Mailroom/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        # Mailroom has no password form. Blank here means the app tells the visitor it is
        # misconfigured, rather than showing an empty screen or a sign-in that cannot work.
        VITE_IDENTITY_ISSUER: ${VITE_IDENTITY_ISSUER:-}
        VITE_ONEOPS_URL: ${VITE_ONEOPS_URL:-http://localhost:5173}
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prabhix

  marketing:
    build:
      context: ../Platform/marketing
      dockerfile: Dockerfile
      # Next inlines NEXT_PUBLIC_* into the bundle at build time, so these must be build args.
      # Passing them under `environment` instead does nothing, and an unset NEXT_PUBLIC_ORG_SLUG
      # does not fail the build — it silently ships a site with no storefront, chat widget or
      # visitor beacon. `.dockerignore` excludes .env.local, so nothing backfills these.
      args:
        # Container-internal, not browser-facing. Browser calls go to the same-origin
        # `/api/backend` prefix, which the Next server proxies via the next.config.ts rewrite, so
        # this value is only ever resolved from inside this container — where `localhost` would be
        # the Next server itself. Named distinctly from NEXT_PUBLIC_API_URL so a host-dev value in
        # .env (localhost:8080) cannot leak in and break the image.
        NEXT_PUBLIC_API_URL: ${MARKETING_INTERNAL_API_URL:-http://backend:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL:-http://localhost:5173}
        # MobiStack is a separate application with its own repository and stack, not part of this
        # Compose project. Defaults to the public host; override to a local port only if you are
        # running that project too.
        NEXT_PUBLIC_MOBISTACK_URL: ${NEXT_PUBLIC_MOBISTACK_URL:-https://mobistack.prabhixtechnologies.com}
        NEXT_PUBLIC_ORG_SLUG: ${NEXT_PUBLIC_ORG_SLUG:-}
        NEXT_PUBLIC_ORG_ID: ${NEXT_PUBLIC_ORG_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    # BusyBox wget: node:alpine has no curl.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - prabhix

  # Company app store — HTML from deploy/app-store/www; APKs streamed from S3 when APK_S3_BUCKET
  # is set (production). Local stacks leave the bucket blank and mount ./store-artifacts via
  # docker-compose.local.yml.
  app-store:
    image: ${REGISTRY:-029096972251.dkr.ecr.ap-south-1.amazonaws.com}/prabhix/app-store:${APP_STORE_TAG:-${TAG:-latest}}
    build:
      context: ./deploy/app-store
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APK_S3_BUCKET: ${APK_S3_BUCKET:-}
      APK_S3_REGION: ${APK_S3_REGION:-${AWS_REGION:-ap-south-1}}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
    networks:
      - prabhix

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
      - admin
      - marketing
      - app-store
    environment:
      # Which service answers /api/v1/auth/* — live sign-in traffic. Defaults to the backend, so
      # nothing changes until the identity service is deployed; setting it to identity:8081 is the
      # cutover and unsetting it is the rollback. Caddy substitutes {$AUTH_UPSTREAM} when it loads the
      # config, so a change here needs the container recreated — which deploy.sh does anyway, for the
      # Caddyfile bind-mount reason below.
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-backend:8080}
      # Which service answers the hosted login page, discovery, JWKS and /oauth2/*. Defaults to
      # identity, unlike the line above: nothing in production calls these until an app is built with
      # VITE_IDENTITY_ISSUER, so there is no traffic to break and a page nobody can load is a page
      # nobody can check.
      OIDC_UPSTREAM: ${OIDC_UPSTREAM:-identity:8081}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A single-file bind mount follows the inode, not the path. `git pull` writes a replacement
      # file rather than editing in place, so after a pull that touches the Caddyfile the container
      # keeps serving the old contents — and `caddy reload` reports success while changing nothing,
      # because it re-reads the same stale inode. deploy.sh recreates this container for that reason.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Extra site blocks, imported by glob. A directory rather than more single files, so adding a
      # site is dropping in a file instead of editing the one above — and so the inode problem
      # described for the Caddyfile does not multiply. Empty by default; the glob matching nothing
      # is not an error.
      - ./deploy/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - prabhix

  # The three images below still come from Docker Hub, and that is deliberate rather than missed.
  # None of them is a Docker Official Image, so AWS does not mirror any of them into the public
  # gallery, and none of them runs in production: mailpit is a developer's SMTP catcher, and
  # Prometheus and Grafana sit behind the `monitoring` profile, which the production box does not
  # enable. Mirroring an image into our registry is worth doing for what we deploy, not for what
  # only ever runs on a laptop.

  # Dev SMTP catcher — matches SMTP_PORT:1025 default in application.yml.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - prabhix

  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/prometheus/secrets/bearer_token:/etc/prometheus/secrets/bearer_token:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - prabhix

  grafana:
    profiles:
      - monitoring
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - prabhix
