server {
    listen 80;
    server_name store.prabhixtechnologies.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Product HTML pages live under www/; APKs are volume-mounted under /artifacts.
    location = /mobistack/android.apk {
        alias /artifacts/mobistack/android.apk;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="mobistack.apk"';
        default_type application/vnd.android.package-archive;
    }
    location = /oneops/android.apk {
        alias /artifacts/oneops/android.apk;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="oneops.apk"';
        default_type application/vnd.android.package-archive;
    }
    location = /mailroom/android.apk {
        alias /artifacts/mailroom/android.apk;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="mailroom.apk"';
        default_type application/vnd.android.package-archive;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
